# HAProxy configuration for the machine, written by the Bunch of AIgents
# installer when the user chose to serve the application behind a proxy.
#
# BOA-MANAGED: this line is how the installer recognises its own file. Remove
# it and the installer will back this file up rather than overwrite it.
#
# This is the machine's proxy, not the application's. It takes the public
# ports and hands the traffic to the application's own HAProxy:
#
#   the world :80  --> this file :80  --> boa-proxy 127.0.0.1:11080 (redirects)
#   the world :443 --> this file :443 -> boa-proxy 127.0.0.1:11443 (send-proxy-v2)
#
# HTTPS is passed through in TCP mode and terminated by the application, which
# is why the real client address has to travel in a PROXY header: there is no
# HTTP layer here to put it in a header.

global
  log /dev/log    local0
  log /dev/log    local1 notice
  chroot /var/lib/haproxy
  stats socket /run/haproxy/admin.sock mode 660 level admin
  stats timeout 30s
  user haproxy
  group haproxy
  daemon

  ca-base /etc/ssl/certs
  crt-base /etc/ssl/private

  ssl-default-bind-ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384
  ssl-default-bind-ciphersuites TLS_AES_128_GCM_SHA256:TLS_AES_256_GCM_SHA384:TLS_CHACHA20_POLY1305_SHA256
  ssl-default-bind-options ssl-min-ver TLSv1.2 no-tls-tickets

defaults
  log     global
  mode    http
  option  httplog
  option  dontlognull
  timeout connect 5000
  timeout client  50000
  timeout server  50000
  errorfile 400 /etc/haproxy/errors/400.http
  errorfile 403 /etc/haproxy/errors/403.http
  errorfile 408 /etc/haproxy/errors/408.http
  errorfile 500 /etc/haproxy/errors/500.http
  errorfile 502 /etc/haproxy/errors/502.http
  errorfile 503 /etc/haproxy/errors/503.http
  errorfile 504 /etc/haproxy/errors/504.http


frontend http-in
  bind *:80
  mode http
  option httplog
  option http-server-close

  # Exactly one X-Forwarded-For, holding an address that parses. Anything else
  # is replaced with the address this connection actually came from.
    acl XffUnica req.hdr_cnt(X-Forwarded-For) eq 1
    acl XffIpValida req.hdr_ip(X-Forwarded-For,-1) -m found
    http-request set-header X-Forwarded-For %[src] unless XffUnica XffIpValida

  # Let's Encrypt's HTTP-01 challenge is served, not redirected.
    acl RetoAcme path_beg /.well-known/acme-challenge/

  http-request redirect scheme https code 301 unless RetoAcme
  default_backend http-out

backend http-out
  mode http
  server srv-http-out 127.0.0.1:11080 check


frontend https-in
  bind *:443
  # In TCP mode: the application terminates TLS, so nothing here reads the
  # request. That is also why the client address travels in a PROXY header.
  mode tcp
  option tcplog
  default_backend https-out

backend https-out
  mode tcp
  # No `option ssl-hello-chk`: its ClientHello predates TLS 1.2, so against a
  # backend that requires TLS 1.2 the check fails every time and marks it
  # down - a 503 with every service running.
  #
  # The check goes to 11080, the application's plain HTTP port, and not to
  # 11443: a TCP check against a TLS bind connects and hangs up without a
  # handshake, and the application's HAProxy logged every one of those as
  # "SSL handshake failure" - measured, 64,075 lines in two days, one every
  # two seconds, burying anything real in the journal. `check-ssl` was tried
  # and swapped one line for another: the check's abrupt close arrived while
  # the handshake was still being finished, and every check logged either
  # that or ECONNRESET. Against 11080 the same connect-and-close is a null
  # session that `option dontlognull` keeps out of the log, and both ports
  # belong to one process, so one answering means the other is there too.
  # No `check-send-proxy`: 11080 does not accept PROXY protocol. Traffic
  # still carries it, with `send-proxy-v2`.
  server srv-https-out 127.0.0.1:11443 check port 11080 send-proxy-v2
