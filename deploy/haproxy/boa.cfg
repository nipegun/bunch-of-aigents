# HAProxy configuration for Bunch of AIgents.
#
# This is the application's own HAProxy, not the machine's. It is what listens
# on the two service ports and it exists for one reason: the local HAProxy
# sends `send-proxy-v2` to port 11443, and the PROXY header arrives *before*
# the TLS handshake. Gunicorn cannot read it there - it terminates TLS first,
# so those bytes break the handshake - while HAProxy accepts both on the same
# bind with `accept-proxy ssl`.
#
#   local HAProxy :443 (tcp, send-proxy-v2)
#       |
#       v
#   this HAProxy :11443   accept-proxy + ssl, terminates TLS
#       |  plain HTTP, X-Forwarded-For with the real client address
#       v
#   gunicorn on a Unix socket
#
# It also serves port 11080, redirecting to HTTPS, which is why there is no
# separate redirector service.

global
  log /dev/log local0
  log /dev/log local1 notice
  # No `maxconn` here, on purpose, and a cap on the descriptors instead.
  #
  # `maxconn 2048` asks the kernel for 4131 file descriptors, and HAProxy does
  # not start when it cannot have them: "Cannot raise FD limit to 4131,
  # current limit is 1024 and hard limit is 4096". Measured on an Alpine LXC
  # running under OpenWrt on a BPI-R3, whose hard limit is 4096: boa-proxy was
  # restarted seventy times over, nothing ever listened on 11443, and the
  # installation ended at "The application did not answer (last code: 000)".
  # A Proxmox LXC has a hard limit of 524288, which is why no test machine
  # here ever showed it.
  #
  # Without `maxconn`, HAProxy works the number out from the descriptors it
  # can actually get - which is what its own message asks for - and
  # `fd-hard-limit` caps what it takes on a machine whose limit is enormous.
  # Measured with the same binary at three hard limits: 4096 gives maxconn
  # 1987, 1024 gives 499, 524288 gives 1987. A LAN application for one person
  # needs a fraction of any of them.
  fd-hard-limit 4000
  # No chroot and no user directive: systemd already runs this as `boa`, and a
  # chroot would put the Unix socket to gunicorn out of reach.
  stats timeout 30s

  ssl-default-bind-ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384
  ssl-default-bind-ciphersuites TLS_AES_128_GCM_SHA256:TLS_AES_256_GCM_SHA384:TLS_CHACHA20_POLY1305_SHA256
  ssl-default-bind-options ssl-min-ver TLSv1.2 no-tls-tickets

defaults
  log     global
  mode    http
  option  httplog
  option  dontlognull
  timeout connect 5s
  timeout client  60s
  timeout server  300s
  # Agent runs started from the interface can take a while to answer.
  timeout http-request 15s


frontend boa-https

  # accept-proxy: the local HAProxy always prefixes the PROXY header, whether
  # the client reached it through the WAN proxy or straight from the LAN.
  # A direct connection to this port without that header is refused, which is
  # correct: nothing but the local HAProxy should be reaching it.
    bind 127.0.0.1:11443 accept-proxy ssl crt /opt/boa/certificates/boa.pem alpn http/1.1

    mode http
    option httplog
    option forwardfor

  # The real client address, recovered from the PROXY header, is what the
  # application rate-limits logins by. Without this it would see 127.0.0.1 for
  # everyone and the limit would be global.
    http-request set-header X-Forwarded-For %[src]
    http-request set-header X-Forwarded-Proto https

  # Security headers are set by the application itself; adding them here too
  # would mean two places to change when one of them is wrong.

    default_backend boa-web


frontend boa-http

  # Plain HTTP. Everything is redirected to HTTPS, keeping the host the client
  # asked for, so reaching the server by IP redirects to that same IP.
    bind 127.0.0.1:11080
    mode http
    option httplog

  # Let's Encrypt's HTTP-01 challenge must not be redirected.
    acl RetoAcme path_beg /.well-known/acme-challenge/
    http-request redirect scheme https code 301 unless RetoAcme

    default_backend boa-web


backend boa-web
  mode http
  option httplog
  # Gunicorn listens on a Unix socket: no port, no TLS, nothing on the network
  # that could be reached without going through this proxy.
  server srv-boa-web /run/boa-web/web.sock check
